<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead9">
<title>SZS 哭牆 5.2 · 紀念宋中鎖總統</title>
<style>
:root{
  --bg:#f3ead9; --paper:#fffaf0; --ink:#4a3a28; --ink-soft:#8a7560;
  --accent:#b07d3e; --accent-dark:#8c5a2b; --line:#e3d5bd; --danger:#a34a3a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:-apple-system,"PingFang TC","PingFang SC","Noto Sans","Microsoft YaHei","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65; min-height:100vh;
}
.wrap{ max-width:880px; margin:0 auto; padding:16px; }
@media(min-width:768px){ .wrap{ padding:28px; } }

header{ text-align:center; padding:22px 12px 14px; }
header .ring{
  width:104px;height:104px;border-radius:50%;margin:0 auto 12px;
  border:4px solid #d9c39a; box-shadow:0 6px 18px rgba(120,90,40,.25);
  background:#fff; display:flex;align-items:center;justify-content:center;overflow:hidden;
}
header .ring img{ width:100%; height:100%; object-fit:cover; }
header h1{ font-size:1.55rem; letter-spacing:.06em; color:var(--accent-dark); }
header p.sub{ color:var(--ink-soft); font-size:.92rem; margin-top:4px; }

.langbar{ text-align:center; margin:6px 0 14px; }
.langbar select{
  font-size:.95rem; padding:8px 12px; border-radius:22px; border:1.5px solid var(--accent);
  background:var(--paper); color:var(--ink); max-width:56%;
}
.langbar input.langsearch{
  font-size:.9rem; padding:8px 12px; border-radius:22px; border:1.5px solid var(--line);
  background:var(--paper); color:var(--ink); width:128px;
}

nav.tabs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
nav.tabs button{
  flex:1 1 auto; min-width:88px; max-width:170px; padding:10px 8px; font-size:.98rem;
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft);
  border-radius:14px; cursor:pointer; transition:.18s;
}
nav.tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

.panel{ display:none; }
.panel.on{ display:block; animation:fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:16px; box-shadow:0 3px 10px rgba(120,90,40,.08);
}
.card h2{ font-size:1.12rem; color:var(--accent-dark); margin-bottom:12px; }
label{ display:block; font-size:.85rem; color:var(--ink-soft); margin:10px 0 4px; }
input[type=text],textarea,select{
  width:100%; font-size:1rem; padding:10px 12px; border-radius:10px;
  border:1.5px solid var(--line); background:#fffdf7; color:var(--ink); font-family:inherit;
}
textarea{ min-height:96px; resize:vertical; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > *{ flex:1 1 140px; }

.btn{
  display:inline-block; padding:10px 22px; border-radius:24px; border:none; cursor:pointer;
  font-size:1rem; background:var(--accent); color:#fff; font-weight:600; margin-top:12px;
  transition:.15s;
}
.btn:hover{ background:var(--accent-dark); }
.btn.ghost{ background:transparent; border:1.5px solid var(--accent); color:var(--accent-dark); }
.btn.small{ padding:5px 12px; font-size:.82rem; border-radius:14px; margin-top:0; }
.btn.danger{ background:transparent; border:1.5px solid var(--danger); color:var(--danger); }

.wall{ display:grid; gap:14px; grid-template-columns:1fr; }
@media(min-width:640px){ .wall{ grid-template-columns:repeat(2,1fr); } }
.note{
  background:#fffcf4; border:1px solid var(--line); border-radius:4px; padding:16px 14px 12px;
  box-shadow:0 4px 12px rgba(120,90,40,.12); position:relative; word-break:break-word;
}
.note::before{
  content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-2deg);
  width:64px; height:18px; background:rgba(214,186,130,.55); border-radius:2px;
}
.note.private-note{ background:#f2ece0; }
.note .txt{ white-space:pre-wrap; font-size:1rem; }
.note .meta{ margin-top:10px; font-size:.75rem; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.badge{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:.7rem; background:var(--line); color:var(--ink-soft); }
.badge.pub{ background:#dcead0; color:#4c6b34; }
.badge.pri{ background:#e6d9c3; color:#8c5a2b; }
.badge.cur{ background:var(--accent); color:#fff; }
.note .ops{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
.empty{ text-align:center; color:var(--ink-soft); padding:34px 10px; font-size:.95rem; }

.member{ display:flex; gap:12px; align-items:flex-start; padding:12px 4px; border-bottom:1px dashed var(--line); }
.member:last-child{ border-bottom:none; }
.avatar{
  width:46px; height:46px; border-radius:50%; background:#eadfca; color:var(--accent-dark);
  display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex:none;
}
.member .who b{ font-size:1rem; }
.member .who .rel{ font-size:.78rem; color:var(--ink-soft); margin-left:6px; }
.member .msg{ font-size:.88rem; color:var(--ink-soft); margin-top:2px; }
.countline{ font-size:.85rem; color:var(--ink-soft); margin:4px 0 10px; }

/* 被紀念人卡片 */
.pcard{
  display:flex; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:16px;
  padding:14px; margin-bottom:12px; box-shadow:0 3px 10px rgba(120,90,40,.08);
  cursor:pointer; position:relative; transition:.15s;
}
.pcard:hover{ border-color:var(--accent); }
.pcard.cur{ outline:2px solid var(--accent); }
.pcard img.pimg{ width:64px; height:64px; border-radius:50%; object-fit:cover; border:3px solid #d9c39a; flex:none; }
.pcard .pava{
  width:64px; height:64px; border-radius:50%; background:#eadfca; border:3px solid #d9c39a;
  display:flex; align-items:center; justify-content:center; font-size:1.8rem; flex:none;
}
.pcard .pinfo{ flex:1; min-width:0; }
.pcard .pinfo b{ font-size:1.05rem; color:var(--accent-dark); }
.pcard .pinfo .pd{ font-size:.78rem; color:var(--ink-soft); }
.pcard .pinfo .pi{ font-size:.85rem; color:var(--ink-soft); margin-top:2px; word-break:break-word; }
.pcard .ops{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.pcard .badge.cur{ position:absolute; top:-9px; right:12px; }

.about-hero{ text-align:center; }
.about-hero img.heroimg{
  width:min(280px,70%); border-radius:14px; border:6px solid #fff; box-shadow:0 8px 24px rgba(120,90,40,.25);
}
.about-hero .heroava{
  width:min(280px,70%); height:200px; margin:0 auto; border-radius:14px; background:#eadfca;
  display:flex; align-items:center; justify-content:center; font-size:4rem;
  border:6px solid #fff; box-shadow:0 8px 24px rgba(120,90,40,.25);
}
.about-hero h2{ margin-top:14px; }
.status{ font-size:.8rem; color:var(--ink-soft); }
.status.ok{ color:#4c6b34; }

.modal-mask{
  position:fixed; inset:0; background:rgba(60,45,25,.45); display:none;
  align-items:center; justify-content:center; z-index:50; padding:18px;
}
.modal-mask.on{ display:flex; }
.modal{ background:var(--paper); border-radius:16px; max-width:520px; width:100%; max-height:80vh; overflow:auto; padding:20px; }
.modal h3{ color:var(--accent-dark); margin-bottom:10px; }
.hist-item{ padding:8px 0; border-bottom:1px dashed var(--line); font-size:.9rem; white-space:pre-wrap; }
.hist-item time{ display:block; font-size:.72rem; color:var(--ink-soft); margin-top:4px; }

footer{ text-align:center; font-size:.75rem; color:var(--ink-soft); padding:22px 0 30px; }
[dir="rtl"] body, [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select{ font-family:"Noto Sans Arabic","Geeza Pro",Arial,sans-serif; }

.userbar{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 auto 14px;font-size:.85rem;color:var(--ink-soft);flex-wrap:wrap}
.uava{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #d9c39a;vertical-align:middle}
.auth-mask{background:rgba(50,38,20,.72)}
.auth-modal{max-width:420px}
.auth-sub{font-size:.82rem;color:var(--ink-soft);margin:2px 0 12px}
.authmodes{display:flex;gap:8px;margin-bottom:6px}
.authmodes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.democode{display:none;margin-top:10px;padding:8px 12px;border-radius:10px;background:#eef3e4;color:#4c6b34;font-size:.9rem;font-weight:600}
.democode.on{display:block}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="ring" id="hdrRing"></div>
  <h1 id="hTitle"></h1>
  <p class="sub" id="hSub"></p>
</header>

<div class="userbar" id="userBar" style="display:none">
  <img id="ubAva" class="uava" style="display:none" alt="">
  <span id="ubText"></span>
  <button class="btn small ghost" id="btnSwitch"></button>
  <button class="btn small ghost" id="btnLogout"></button>
</div>

<div class="langbar">
  <input type="text" id="langSearch" class="langsearch">
  <select id="langSel"></select>
</div>

<nav class="tabs" id="tabs">
  <button data-p="persons"></button>
  <button data-p="wall" class="on"></button>
  <button data-p="members"></button>
  <button data-p="feedback"></button>
  <button data-p="about"></button>
</nav>

<!-- 被紀念的人 -->
<section class="panel" id="p-persons">
  <div class="card">
    <h2 id="personFormTitle"></h2>
    <input type="hidden" id="pEditId">
    <div class="row">
      <div><label id="lblPName"></label><input type="text" id="pName" maxlength="60"></div>
      <div><label id="lblPBorn"></label><input type="text" id="pBorn" maxlength="60"></div>
    </div>
    <div class="row">
      <div><label id="lblPDied"></label><input type="text" id="pDied" maxlength="60"></div>
      <div><label id="lblPPhoto"></label><input type="file" id="pPhoto" accept="image/*"></div>
    </div>
    <label id="lblPIntro"></label>
    <textarea id="pIntro" maxlength="1000" style="min-height:72px"></textarea>
    <div id="pPhotoPrev"></div>
    <div style="margin-top:14px">
      <button class="btn" id="btnSavePerson"></button>
      <button class="btn ghost" id="btnCancelPerson" style="display:none"></button>
    </div>
  </div>
  <div class="countline" id="personCount"></div>
  <div id="personList"></div>
</section>

<!-- 紀念牆 -->
<section class="panel on" id="p-wall">
  <div class="card">
    <h2 id="wallFormTitle"></h2>
    <input type="hidden" id="editId">
    <label id="lblAuthor"></label>
    <input type="text" id="noteAuthor" maxlength="30">
    <label id="lblNote"></label>
    <textarea id="noteText" maxlength="1000"></textarea>
    <div class="row">
      <div><label id="lblVis"></label>
        <select id="noteVis">
          <option value="public" id="optPub"></option>
          <option value="private" id="optPri"></option>
        </select></div>
      <div><label id="lblPerm"></label>
        <select id="notePerm">
          <option value="everyone" id="optEvery"></option>
          <option value="members" id="optMem"></option>
        </select></div>
    </div>
    <div style="margin-top:14px">
      <button class="btn" id="btnSaveNote"></button>
      <button class="btn ghost" id="btnCancelEdit" style="display:none"></button>
    </div>
  </div>
  <div class="countline" id="noteCount"></div>
<div style="text-align:center;margin:-6px 0 14px"><button class="btn ghost" id="btnDownload" style="margin-top:0">⬇</button></div>
  <div class="wall" id="wallList"></div>
</section>

<!-- 成員 -->
<section class="panel" id="p-members">
  <div class="card">
    <p class="countline" id="joinHint" style="margin:0"></p>
  </div>
  <div class="countline" id="memberCount"></div>
  <div class="card" id="memberListWrap"><div id="memberList"></div></div>
</section>

<!-- 反饋 -->
<section class="panel" id="p-feedback">
  <div class="card">
    <h2 id="fbTitle"></h2>
    <p class="countline" id="fbAnonymous"></p>
    <label id="lblFb"></label>
    <textarea id="fbText" maxlength="2000"></textarea>
    <button class="btn" id="btnFb"></button>
    <p class="status" id="fbStatus" style="margin-top:10px"></p>
  </div>
  <div class="card">
    <label id="lblEndpoint" style="margin-top:0"></label>
    <input type="text" id="endpoint" placeholder="https://example.com/api/feedback">
    <button class="btn small ghost" id="btnEndpoint" style="margin-top:10px"></button>
    <p class="countline" id="fbQueueInfo" style="margin-top:10px"></p>
  </div>
</section>

<!-- 介紹 -->
<section class="panel" id="p-about">
  <div class="card about-hero">
    <div id="aboutBox"></div>
    <h2 id="aboutName"></h2>
    <p id="aboutText" style="margin-top:10px; color:var(--ink-soft);"></p>
    <p id="aboutDates" style="margin-top:8px;"></p>
  </div>
</section>


<!-- 註冊 / 登入（5.0） -->
<div class="modal-mask auth-mask" id="authMask">
  <div class="modal auth-modal">
    <h3 id="authTitle"></h3>
    <p class="auth-sub" id="authSub"></p>
    <div class="authmodes">
      <button class="btn small ghost" id="mPhone"></button>
      <button class="btn small ghost" id="mEmail"></button>
    </div>
    <div id="phoneBox">
      <label id="lblCC2" style="margin-top:6px"></label>
      <select id="ccSel"></select>
      <label id="lblPhone2"></label>
      <input type="text" id="authPhone" inputmode="tel" maxlength="20">
    </div>
    <div id="emailBox" style="display:none">
      <label id="lblEmail2" style="margin-top:6px"></label>
      <input type="text" id="authEmail" inputmode="email" maxlength="80">
    </div>
    <button class="btn small ghost" id="btnSendCode" style="margin-top:12px"></button>
    <div class="democode" id="demoCode"></div>
    <label id="lblCode"></label>
    <input type="text" id="authCode" inputmode="numeric" maxlength="6">
    <label id="lblAvatar"></label>
    <input type="file" id="authAvatar" accept="image/*">
    <div id="avatarPrev" style="margin-top:6px"></div>
    <button class="btn" id="btnVerify" style="width:100%"></button>
  </div>
</div>

<footer>SZS 哭牆 5.2 · 離綫可用 · 資料保存在本機 · 多賬號本地切換</footer>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button class="btn small" id="modalClose" style="margin-top:14px"></button>
  </div>
</div>

/* ============ 被紀念的人（4.0 核心功能） ============ */
let photoData = "";
function previewPhoto(){
  $("pPhotoPrev").innerHTML = photoData
    ? `<img src="${photoData}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #d9c39a;margin-top:8px">`
    : "";
}
function downscale(src, max, cb){
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * s));
    c.height = Math.max(1, Math.round(img.height * s));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL("image/jpeg", .85));
  };
  img.src = src;
}
$("pPhoto").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => downscale(ev.target.result, 320, url => { photoData = url; previewPhoto(); });
  r.readAsDataURL(f);
});
function renderPersons(){
  const sorted = [...persons].sort((a,b) => (b.pin?1:0)-(a.pin?1:0) || b.ts - a.ts);
  $("personCount").textContent = `${persons.length} ${t("personUnit")}`;
  $("personList").innerHTML = sorted.length ? sorted.map(p => `
    <div class="pcard ${p.id===currentPid?"cur":""}" onclick="selectPerson('${p.id}')">
      ${p.photo ? `<img class="pimg" src="${p.photo}" alt="${esc(p.name)}">` : `<div class="pava">🕯️</div>`}
      <div class="pinfo">
        <b>${esc(p.name)}</b>
        <div class="pd">${esc([p.born, p.died].filter(Boolean).join(" ~ ") || "—")}</div>
        ${p.intro ? `<div class="pi">${esc(p.intro)}</div>` : ""}
        ${(!p.uid || (user && p.uid === user.id)) ? `
        <div class="ops">
          <button class="btn small ghost" onclick="event.stopPropagation();startEditPerson('${p.id}')">${t("edit")}</button>
          <button class="btn small danger" onclick="event.stopPropagation();delPerson('${p.id}')">${t("del")}</button>
        </div>` : ""}
      </div>
      ${p.id===currentPid ? `<span class="badge cur">${t("curBadge")}</span>` : ""}
    </div>`).join("") : `<div class="empty">${t("personsEmpty")}</div>`;
}
window.selectPerson = function(id){
  currentPid = id; store.set("cur", id);
  applyPerson(); renderPersons();
  document.querySelector('#tabs button[data-p="wall"]').click();
};
function cancelPersonEdit(){
  $("pEditId").value = "";
  ["pName","pBorn","pDied","pIntro"].forEach(i => $(i).value = "");
  $("pPhoto").value = ""; photoData = ""; previewPhoto();
  $("btnCancelPerson").style.display = "none";
}
window.startEditPerson = function(id){
  const p = persons.find(x => x.id === id);
  if(!p || (p.uid && (!user || p.uid !== user.id))) return;
  $("pEditId").value = id;
  $("pName").value = p.name; $("pBorn").value = p.born || "";
  $("pDied").value = p.died || ""; $("pIntro").value = p.intro || "";
  photoData = p.photo || ""; previewPhoto();
  $("btnCancelPerson").style.display = "inline-block";
  $("p-persons").scrollIntoView({behavior:"smooth"});
};
$("btnCancelPerson").addEventListener("click", cancelPersonEdit);
$("btnSavePerson").addEventListener("click", () => {
  const name = $("pName").value.trim();
  if(!name){ alert(t("errName")); return; }
  if(!user){ alert(t("loginFirst")); showAuth(); return; }
  const born = $("pBorn").value.trim(), died = $("pDied").value.trim(), intro = $("pIntro").value.trim();
  const editId = $("pEditId").value;
  if(editId){
    const p = persons.find(x => x.id === editId);
    if(p){
      p.name = name; p.born = born; p.died = died; p.intro = intro;
      if(photoData) p.photo = photoData;
    }
  }else{

window.delPerson = function(id){
  const p0 = persons.find(x => x.id === id);
  if(p0 && p0.uid && (!user || p0.uid !== user.id)) return;
  if(!confirm(t("confirmDelPerson"))) return;
  persons = persons.filter(p => p.id !== id);
  notes = notes.filter(n => n.pid !== id);
  members = members.filter(m => m.pid !== id);
  store.set("persons", persons); store.set("notes", notes); store.set("members", members);
  if(currentPid === id){
    currentPid = persons.length ? persons[0].id : "";
    store.set("cur", currentPid);
  }
  renderPersons(); applyPerson();
};
function applyPerson(){
  const p = curPerson();
  if(!p){

    ? `<img src="${p.photo}" alt="${esc(p.name)}">`
    : `<div class="pava" style="width:100%;height:100%;border-radius:50%;background:#eadfca;display:flex;align-items:center;justify-content:center;font-size:3rem">🕯️</div>`;

}
function renderAbout(){
  const p = curPerson(); if(!p) return;

    ? `<img class="heroimg" src="${p.photo}" alt="${esc(p.name)}">`
    : `<div class="heroava">🕯️</div>`;

/* ============ 紀念牆（5.2：權限與賬號綁定） ============ */
function canManageNote(n){ return n.uid ? !!(user && n.uid === user.id) : true; }
function noteAuthorOf(n){
  if(!n.uid) return null;
  return users.find(u => u.id === n.uid) || null;
}
function renderWall(){
  const pub = myNotes().filter(n => n.vis === "public");
  const priv = user ? myNotes().filter(n => n.vis === "private" && n.uid === user.id) : [];
  const shown = [...priv, ...pub];
  $("noteCount").textContent = `${pub.length} ${t("noteUnit")}`;
  const list = $("wallList");
  if(!shown.length){ list.innerHTML = `<div class="empty" style="grid-column:1/-1">${t("empty")}</div>`; return; }
  list.innerHTML = shown.map(n => {
    const au = noteAuthorOf(n);
    return `
    <div class="note ${n.vis==="private"?"private-note":""}">
      <div class="txt">${esc(n.text)}</div>
      <div class="meta">
        ${n.vis==="private"?`<span class="badge pri">${t("dlPrivate")}</span>`:""}
        <span class="badge ${n.perm==="everyone"?"pub":"pri"}">${n.perm==="everyone"?t("every"):t("memb")}</span>
        ${au && au.avatar ? `<img src="${au.avatar}" class="uava" alt="">` : ""}
        ${n.author?`<span>— ${esc(n.author)}</span>`:""}
        <span>${t("created")} ${fmt(n.ts)}</span>
        ${n.upd?`<span>${t("editedMark")} ${fmt(n.upd)}</span>`:""}
      </div>
      ${canManageNote(n)?`
      <div class="ops">
        <button class="btn small ghost" onclick="startEdit('${n.id}')">${t("edit")}</button>
        <button class="btn small ghost" onclick="showHistory('${n.id}')">${t("viewHistory")}</button>
        <button class="btn small danger" onclick="delNote('${n.id}')">${t("del")}</button>
      </div>`:""}
    </div>`; }).join("");
}

window.startEdit = function(id){
  const n = notes.find(x => x.id === id); if(!n || !canManageNote(n)) return;
  $("editId").value = id;
  $("noteText").value = n.text; $("noteAuthor").value = n.author || "";
  $("noteVis").value = n.vis; $("notePerm").value = n.perm;
  $("btnCancelEdit").style.display = "inline-block";
  $("p-wall").scrollIntoView({behavior:"smooth"});
};
$("btnCancelEdit").addEventListener("click", () => {
  $("editId").value = ""; $("noteText").value = ""; $("noteAuthor").value = "";
  $("btnCancelEdit").style.display = "none";
});
$("btnSaveNote").addEventListener("click", () => {
  if(!user){ alert(t("loginFirst")); showAuth(); return; }
  const text = $("noteText").value.trim();
  if(!text){ alert(t("errText")); return; }
  const author = user.contact;
  const vis = $("noteVis").value, perm = $("notePerm").value;
  const editId = $("editId").value;
  if(editId){
    const n = notes.find(x => x.id === editId);
    if(n && canManageNote(n)){
      if(n.text !== text) (n.hist = n.hist || []).push({text: n.text, ts: n.ts});
      n.text = text; n.vis = vis; n.perm = perm; n.upd = Date.now();
    }
  }else{
    notes.unshift({id:"n"+Date.now(), pid:currentPid, author, uid:user.id, text, vis, perm, ts:Date.now(), upd:0, hist:[]});
  }
  store.set("notes", notes);
  $("btnCancelEdit").click();
  renderWall();
});
window.delNote = function(id){
  const n = notes.find(x => x.id === id);
  if(!n || !canManageNote(n)) return;
  if(!confirm(t("confirmDel"))) return;
  notes = notes.filter(x => x.id !== id);
  store.set("notes", notes); renderWall();
};
window.showHistory = function(id){
  const n = notes.find(x => x.id === id); if(!n) return;
  const h = n.hist || [];
  $("modalBody").innerHTML = h.length
    ? h.map(x => `<div class="hist-item">${esc(x.text)}<time>${fmt(x.ts)}</time></div>`).join("")
    : `<div class="empty">—</div>`;
  $("mask").classList.add("on");
};
$("modalClose").addEventListener("click", () => $("mask").classList.remove("on"));
$("mask").addEventListener("click", e => { if(e.target === $("mask")) $("mask").classList.remove("on"); });

function joined(){ return user ? members.find(m => m.pid === currentPid && m.uid === user.id) : null; }
function memberEntry(m){
  if(m.uid){
    const u = users.find(x => x.id === m.uid);
    if(!u) return null;
    return {img:u.avatar||"", ava:"🕯️", title:u.contact, nick:m.nick||"", rel:m.rel||"", msg:m.msg||"", ts:m.ts, mine:!!(user && user.id === m.uid)};
  }
  return {img:"", ava:m.ava||"🕯️", title:m.name||"", nick:m.nick||"", rel:m.rel||"", msg:m.msg||"", ts:m.ts, mine:false};
}

function renderFbQueue(){
  const q = fbList.filter(x => x.status === "queued").length;
  const s = fbList.filter(x => x.status === "sent").length;
  $("fbQueueInfo").textContent = tFill("fbQueue", {n:q, m:s});
}
$("btnFb").addEventListener("click", () => {
  const text = $("fbText").value.trim();
  if(!text){ alert(t("errText")); return; }
  fbList.unshift({id:"f"+Date.now(), text, ts:Date.now(), status:"queued"});
  store.set("fb", fbList);
  $("fbText").value = "";
  $("fbStatus").textContent = "· " + t("fbThanks") + " " + t("fbQueued");
  renderFbQueue(); trySendFb();
});
$("btnEndpoint").addEventListener("click", () => {
  endpoint = $("endpoint").value.trim(); store.set("endpoint", endpoint);
  $("fbStatus").textContent = "· OK"; trySendFb();
});
async function trySendFb(){
  if(!endpoint) return;
  const pend = fbList.filter(x => x.status === "queued");
  for(const f of pend){
    try{
      await fetch(endpoint, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text:f.text, ts:f.ts, lang})});
      f.status = "sent";
    }catch(e){ /* 保持 queued，下次再試 */ }
  }
  store.set("fb", fbList); renderFbQueue();
  const q = fbList.filter(x => x.status === "queued").length;
  $("fbStatus").textContent = q ? "· " + t("fbQueued") : "· " + t("fbSent");
}
window.addEventListener("online", trySendFb);

      <button class="btn small danger" onclick="event.stopPropagation();delAccount('${u.id}')">${t("delAcc")}</button>
    </div>`).join("");
  $("modalBody").innerHTML = rows + `
    <button class="btn" style="width:100%" onclick="$('mask').classList.remove('on');showAuth()">＋ ${t("addAcc")}</button>`;
  $("mask").classList.add("on");
};

  currentUid = id; store.set("curUser", id);

};
window.delAccount = function(id){
  if(!confirm(t("confirmDelAcc"))) return;
  users = users.filter(u => u.id !== id);
  store.set("users", users);
  if(id === currentUid){
    currentUid = ""; user = null; store.set("curUser", "");
    $("mask").classList.remove("on");
    renderUserBar(); renderWall(); renderMembers(); applyPerson(); showAuth();
  }else{
    openSwitch();
  }
};

/* ============ 下載紀念文案（5.2：PDF，離綫生成） ============ */
function wrapLines(ctx, text, maxW){
  const lines = []; let line = "";
  for(const ch of String(text)){
    if(ch === "\n"){ lines.push(line); line = ""; continue; }
    if(line && ctx.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
    else line += ch;
  }
  lines.push(line); return lines;
}
function jpegBytes(dataUrl){
  const b = atob(dataUrl.split(",")[1]); const a = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function makePdf(images, wPt, hPt, imgW, imgH){
  const enc = new TextEncoder(); const parts = []; let pos = 0;
  const add = x => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const n = images.length, total = 2 + 3 * n, offsets = [];
  add("%PDF-1.4\n");
  const obj = (num, body) => { offsets[num] = pos; add(num + " 0 obj\n" + body + "endobj\n"); };
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>\n");
  const kids = []; for(let i = 0; i < n; i++) kids.push((3 + 3 * i) + " 0 R");
  obj(2, "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + n + " >>\n");
  for(let i = 0; i < n; i++){
    const cRef = 4 + 3 * i, imRef = 5 + 3 * i;
    obj(3 + 3 * i, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + wPt + " " + hPt + "] /Resources << /XObject << /Im" + i + " " + imRef + " 0 R >> >> /Contents " + cRef + " 0 R >>\n");
    const stream = "q\n" + wPt + " 0 0 " + hPt + " 0 0 cm\n/Im" + i + " Do\nQ\n";
    obj(cRef, "<< /Length " + enc.encode(stream).length + " >>\nstream\n" + stream + "endstream\n");
    const img = jpegBytes(images[i]);
    offsets[imRef] = pos;
    add(imRef + " 0 obj\n");
    add("<< /Type /XObject /Subtype /Image /Width " + imgW + " /Height " + imgH + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + img.length + " >>\nstream\n");
    add(img); add("\nendstream\nendobj\n");
  }
  const xrefPos = pos;
  let xref = "xref\n0 " + (total + 1) + "\n0000000000 65535 f \n";
  for(let i = 1; i <= total; i++) xref += String(offsets[i] || 0).padStart(10, "0") + " 00000 n \n";
  add(xref);
  add("trailer\n<< /Size " + (total + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF");
  return new Blob(parts, {type: "application/pdf"});
}
function roundRect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
$("btnDownload").addEventListener("click", () => {
  const p = curPerson(); if(!p) return;
  const L = I18N[lang] || I18N["zh-TW"];
  const pub = myNotes().filter(n => n.vis === "public").sort((a, b) => a.ts - b.ts);
  const F = '\"PingFang TC\",\"PingFang SC\",\"Noto Sans\",\"Microsoft YaHei\",sans-serif';
  const PW = 1240, PH = 1754, M = 90, CW = PW - M * 2;
  const pages = []; let cv, ctx, y;
  function newPage(){
    cv = document.createElement("canvas"); cv.width = PW; cv.height = PH;
    ctx = cv.getContext("2d"); ctx.fillStyle = "#f3ead9"; ctx.fillRect(0, 0, PW, PH); y = M;
  }
  function ensure(h){ if(y + h > PH - M){ pages.push(cv); newPage(); } }
  newPage();
  ctx.textAlign = "center"; ctx.fillStyle = "#8c5a2b"; ctx.font = "bold 54px " + F;
  ensure(90); ctx.fillText(p.name, PW / 2, y + 52); y += 92;

  const img = new Image();
  img.onload = drawRest;
  if(p.photo) img.src = p.photo; else drawRest();

  function drawRest(){
    if(p.photo){
      ensure(330);
      const sz = 300, cx = PW / 2;
      ctx.save(); ctx.beginPath(); ctx.arc(cx, y + sz / 2, sz / 2, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(img, cx - sz / 2, y, sz, sz); ctx.restore();
      ctx.strokeStyle = "#d9c39a"; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(cx, y + sz / 2, sz / 2 + 4, 0, Math.PI * 2); ctx.stroke();
      y += sz + 42;
    }
    const dates = [p.born, p.died].filter(Boolean).join(" ~ ");
    if(dates){
      ctx.font = "26px " + F; ctx.fillStyle = "#8a7560";
      ensure(44); ctx.fillText(dates, PW / 2, y + 26); y += 48;
    }
    if(p.intro){
      ctx.font = "25px " + F; ctx.fillStyle = "#8a7560";
      const lines = wrapLines(ctx, p.intro, CW - 120);
      ensure(lines.length * 36 + 30);
      lines.forEach((ln, i) => ctx.fillText(ln, PW / 2, y + 28 + i * 36));
      y += lines.length * 36 + 36;
    }
    ctx.textAlign = "left";
    for(const n of pub){
      ctx.font = "26px " + F;
      const lines = wrapLines(ctx, n.text, CW - 80);
      const meta = (n.author ? L.dlBy + "：" + n.author + " · " : "") + fmt(n.ts);
      const cardH = 48 + lines.length * 38 + 42;
      ensure(cardH + 34);
      ctx.fillStyle = "#fffaf0"; roundRect(ctx, M, y, CW, cardH, 14); ctx.fill();
      ctx.strokeStyle = "#e3d5bd"; ctx.lineWidth = 2; roundRect(ctx, M, y, CW, cardH, 14); ctx.stroke();
      ctx.fillStyle = "#4a3a28"; ctx.font = "26px " + F;
      lines.forEach((ln, i) => ctx.fillText(ln, M + 40, y + 50 + i * 38));
      ctx.fillStyle = "#8a7560"; ctx.font = "20px " + F;
      ctx.fillText(meta, M + 40, y + cardH - 20);
      y += cardH + 32;
    }
    pages.push(cv);
    const jpgs = pages.map(c => c.toDataURL("image/jpeg", 0.9));
    const blob = makePdf(jpgs, 595.28, 841.89, PW, PH);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = p.name.replace(/[\\/:*?"<>|]/g, "_") + " - " + L.dlTitle + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
});
