<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ead9">
<title>SZS 哭牆 · 紀念宋中鎖總統</title>
<style>
:root{
  --bg:#f3ead9; --paper:#fffaf0; --ink:#4a3a28; --ink-soft:#8a7560;
  --accent:#b07d3e; --accent-dark:#8c5a2b; --line:#e3d5bd; --danger:#a34a3a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:-apple-system,"PingFang TC","PingFang SC","Noto Sans","Microsoft YaHei","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65; min-height:100vh;
}
.wrap{ max-width:880px; margin:0 auto; padding:16px; }
@media(min-width:768px){ .wrap{ padding:28px; } }

header{ text-align:center; padding:22px 12px 14px; }
header .ring{
  width:104px;height:104px;border-radius:50%;margin:0 auto 12px;
  border:4px solid #d9c39a; box-shadow:0 6px 18px rgba(120,90,40,.25);
  background:#fff; display:flex;align-items:center;justify-content:center;overflow:hidden;
}
header .ring img{ width:100%; height:100%; object-fit:cover; }
header h1{ font-size:1.55rem; letter-spacing:.06em; color:var(--accent-dark); }
header p.sub{ color:var(--ink-soft); font-size:.92rem; margin-top:4px; }

.langbar{ text-align:center; margin:6px 0 14px; }
.langbar select{
  font-size:.95rem; padding:8px 12px; border-radius:22px; border:1.5px solid var(--accent);
  background:var(--paper); color:var(--ink); max-width:92%;
}

nav.tabs{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
nav.tabs button{
  flex:1 1 auto; min-width:96px; max-width:180px; padding:10px 8px; font-size:.98rem;
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft);
  border-radius:14px; cursor:pointer; transition:.18s;
}
nav.tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

.panel{ display:none; }
.panel.on{ display:block; animation:fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:16px; box-shadow:0 3px 10px rgba(120,90,40,.08);
}
.card h2{ font-size:1.12rem; color:var(--accent-dark); margin-bottom:12px; }
label{ display:block; font-size:.85rem; color:var(--ink-soft); margin:10px 0 4px; }
input[type=text],textarea,select{
  width:100%; font-size:1rem; padding:10px 12px; border-radius:10px;
  border:1.5px solid var(--line); background:#fffdf7; color:var(--ink); font-family:inherit;
}
textarea{ min-height:96px; resize:vertical; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row > *{ flex:1 1 140px; }

.btn{
  display:inline-block; padding:10px 22px; border-radius:24px; border:none; cursor:pointer;
  font-size:1rem; background:var(--accent); color:#fff; font-weight:600; margin-top:12px;
  transition:.15s;
}
.btn:hover{ background:var(--accent-dark); }
.btn.ghost{ background:transparent; border:1.5px solid var(--accent); color:var(--accent-dark); }
.btn.small{ padding:5px 12px; font-size:.82rem; border-radius:14px; margin-top:0; }
.btn.danger{ background:transparent; border:1.5px solid var(--danger); color:var(--danger); }

.wall{ display:grid; gap:14px; grid-template-columns:1fr; }
@media(min-width:640px){ .wall{ grid-template-columns:repeat(2,1fr); } }
.note{
  background:#fffcf4; border:1px solid var(--line); border-radius:4px; padding:16px 14px 12px;
  box-shadow:0 4px 12px rgba(120,90,40,.12); position:relative; word-break:break-word;
}
.note::before{
  content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%) rotate(-2deg);
  width:64px; height:18px; background:rgba(214,186,130,.55); border-radius:2px;
}
.note.private-note{ background:#f2ece0; }
.note .txt{ white-space:pre-wrap; font-size:1rem; }
.note .meta{ margin-top:10px; font-size:.75rem; color:var(--ink-soft); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.badge{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:.7rem; background:var(--line); color:var(--ink-soft); }
.badge.pub{ background:#dcead0; color:#4c6b34; }
.badge.pri{ background:#e6d9c3; color:#8c5a2b; }
.note .ops{ margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
.empty{ text-align:center; color:var(--ink-soft); padding:34px 10px; font-size:.95rem; }

.member{ display:flex; gap:12px; align-items:flex-start; padding:12px 4px; border-bottom:1px dashed var(--line); }
.member:last-child{ border-bottom:none; }
.avatar{
  width:46px; height:46px; border-radius:50%; background:#eadfca; color:var(--accent-dark);
  display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex:none;
}
.member .who b{ font-size:1rem; }
.member .who .rel{ font-size:.78rem; color:var(--ink-soft); margin-left:6px; }
.member .msg{ font-size:.88rem; color:var(--ink-soft); margin-top:2px; }
.countline{ font-size:.85rem; color:var(--ink-soft); margin:4px 0 10px; }

.about-hero{ text-align:center; }
.about-hero img{
  width:min(280px,70%); border-radius:14px; border:6px solid #fff; box-shadow:0 8px 24px rgba(120,90,40,.25);
}
.about-hero h2{ margin-top:14px; }
.status{ font-size:.8rem; color:var(--ink-soft); }
.status.ok{ color:#4c6b34; }

.modal-mask{
  position:fixed; inset:0; background:rgba(60,45,25,.45); display:none;
  align-items:center; justify-content:center; z-index:50; padding:18px;
}
.modal-mask.on{ display:flex; }
.modal{ background:var(--paper); border-radius:16px; max-width:520px; width:100%; max-height:80vh; overflow:auto; padding:20px; }
.modal h3{ color:var(--accent-dark); margin-bottom:10px; }
.hist-item{ padding:8px 0; border-bottom:1px dashed var(--line); font-size:.9rem; white-space:pre-wrap; }
.hist-item time{ display:block; font-size:.72rem; color:var(--ink-soft); margin-top:4px; }

footer{ text-align:center; font-size:.75rem; color:var(--ink-soft); padding:22px 0 30px; }
[dir="rtl"] body, [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select{ font-family:"Noto Sans Arabic","Geeza Pro",Arial,sans-serif; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="ring"><img id="hdrPortrait" alt="宋中鎖總統"></div>
  <h1 id="hTitle"></h1>
  <p class="sub" id="hSub"></p>
</header>

<div class="langbar"><select id="langSel"></select></div>

<nav class="tabs" id="tabs">
  <button data-p="wall" class="on"></button>
  <button data-p="members"></button>
  <button data-p="feedback"></button>
  <button data-p="about"></button>
</nav>

<!-- 紀念牆 -->
<section class="panel on" id="p-wall">
  <div class="card">
    <h2 id="wallFormTitle"></h2>
    <input type="hidden" id="editId">
    <label id="lblAuthor"></label>
    <input type="text" id="noteAuthor" maxlength="30">
    <label id="lblNote"></label>
    <textarea id="noteText" maxlength="1000"></textarea>
    <div class="row">
      <div><label id="lblVis"></label>
        <select id="noteVis">
          <option value="public" id="optPub"></option>
          <option value="private" id="optPri"></option>
        </select></div>
      <div><label id="lblPerm"></label>
        <select id="notePerm">
          <option value="everyone" id="optEvery"></option>
          <option value="members" id="optMem"></option>
        </select></div>
    </div>
    <div style="margin-top:14px">
      <button class="btn" id="btnSaveNote"></button>
      <button class="btn ghost" id="btnCancelEdit" style="display:none"></button>
    </div>
  </div>
  <div class="countline" id="noteCount"></div>
  <div class="wall" id="wallList"></div>
</section>

<!-- 成員 -->
<section class="panel" id="p-members">
  <div class="card">
    <h2 id="memberFormTitle"></h2>
    <div class="row">
      <div><label id="lblMName"></label><input type="text" id="mName" maxlength="30"></div>
      <div><label id="lblMNick"></label><input type="text" id="mNick" maxlength="30"></div>
    </div>
    <div class="row">
      <div><label id="lblMRel"></label><input type="text" id="mRel" maxlength="40"></div>
      <div><label id="lblMAva"></label><input type="text" id="mAva" maxlength="4"></div>
    </div>
    <label id="lblMMsg"></label>
    <input type="text" id="mMsg" maxlength="120">
    <button class="btn" id="btnJoin"></button>
  </div>
  <div class="countline" id="memberCount"></div>
  <div class="card" id="memberListWrap"><div id="memberList"></div></div>
</section>

<!-- 反饋 -->
<section class="panel" id="p-feedback">
  <div class="card">
    <h2 id="fbTitle"></h2>
    <p class="countline" id="fbAnonymous"></p>
    <label id="lblFb"></label>
    <textarea id="fbText" maxlength="2000"></textarea>
    <button class="btn" id="btnFb"></button>
    <p class="status" id="fbStatus" style="margin-top:10px"></p>
  </div>
  <div class="card">
    <label id="lblEndpoint" style="margin-top:0"></label>
    <input type="text" id="endpoint" placeholder="https://example.com/api/feedback">
    <button class="btn small ghost" id="btnEndpoint" style="margin-top:10px"></button>
    <p class="countline" id="fbQueueInfo" style="margin-top:10px"></p>
  </div>
</section>

<!-- 介紹 -->
<section class="panel" id="p-about">
  <div class="card about-hero">
    <img id="aboutPortrait" alt="宋中鎖總統">
    <h2 id="aboutTitle"></h2>
    <p id="aboutBody" style="margin-top:10px; color:var(--ink-soft);"></p>
    <p id="aboutBorn" style="margin-top:8px;"></p>
  </div>
</section>

<footer>SZS 哭牆 · 離綫可用 · 資料保存在本機</footer>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button class="btn small" id="modalClose" style="margin-top:14px"></button>
  </div>
</div>

/* ============ 資料存儲（本機離綫） ============ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("szs_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("szs_"+k, JSON.stringify(v)); }catch(e){} }
};
let lang   = store.get("lang", "zh-TW");
let notes  = store.get("notes", []);       // {id,author,text,vis,perm,ts,upd,hist:[{text,ts}]}
let members= store.get("members", []);     // {id,name,nick,rel,ava,msg,ts}
let fbList = store.get("fb", []);          // {id,text,ts,status:queued|sent}
let endpoint = store.get("endpoint", "");

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => new Date(ts).toLocaleString();
const t = k => (I18N[lang] && I18N[lang][k]) || I18N["zh-TW"][k] || k;
const tFill = (k, o) => t(k).replace("{n}", o.n).replace("{m}", o.m);

/* ============ 語言 ============ */
function buildLangSel(){
  $("langSel").innerHTML = LANGS.map(([c,n]) =>
    `<option value="${c}" ${c===lang?"selected":""}>${n}</option>`).join("");
}
function applyLang(){
  const L = I18N[lang] || I18N["zh-TW"];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ug" || lang === "bo") ? "rtl" : "ltr";
  document.title = `${L.app} · ${L.memorial}`;
  $("hTitle").textContent = L.app;
  $("hSub").textContent = L.memorial + " — " + L.born;
  $("tabs").querySelectorAll("button").forEach(b => b.textContent = L["tab"+b.dataset.p[0].toUpperCase()+b.dataset.p.slice(1)]);
  $("wallFormTitle").textContent = L.write;
  $("lblAuthor").textContent = L.author; $("lblNote").textContent = L.note;
  $("noteText").placeholder = L.placeholder;
  $("lblVis").textContent = L.vis; $("optPub").textContent = L.pub; $("optPri").textContent = L.pri;
  $("lblPerm").textContent = L.perm; $("optEvery").textContent = L.every; $("optMem").textContent = L.memb;
  $("btnSaveNote").textContent = L.save; $("btnCancelEdit").textContent = L.cancel;
  $("memberFormTitle").textContent = L.join;
  $("lblMName").textContent = L.mName; $("lblMNick").textContent = L.mNick;
  $("lblMRel").textContent = L.mRel; $("lblMAva").textContent = L.mAva; $("lblMMsg").textContent = L.mMsg;
  $("btnJoin").textContent = L.join;
  $("fbTitle").textContent = L.fb; $("lblFb").textContent = L.note;
  $("fbText").placeholder = L.fbPh; $("btnFb").textContent = L.fbSend;
  $("fbAnonymous").textContent = "· " + L.fbAnon;
  $("lblEndpoint").textContent = L.endpoint; $("btnEndpoint").textContent = L.epSave;
  $("aboutTitle").textContent = L.aboutTitle;
  $("aboutBody").textContent = L.aboutBody; $("aboutBorn").textContent = L.aboutBorn;
  $("modalClose").textContent = L.close;
  $("modalTitle").textContent = L.history;
  renderWall(); renderMembers(); renderFbQueue();
}

/* ============ 分頁 ============ */
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x===b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-"+b.dataset.p));
});
$("langSel").addEventListener("change", e => { lang = e.target.value; store.set("lang", lang); applyLang(); });

/* ============ 紀念牆 ============ */
function renderWall(){
  const pub = notes.filter(n => n.vis === "public");
  $("noteCount").textContent = `${pub.length} ${t("noteUnit")}`;
  const list = $("wallList");
  if(!pub.length){ list.innerHTML = `<div class="empty" style="grid-column:1/-1">${t("empty")}</div>`; return; }
  list.innerHTML = pub.map(n => `
    <div class="note ${n.vis==="private"?"private-note":""}">
      <div class="txt">${esc(n.text)}</div>
      <div class="meta">
        <span class="badge ${n.perm==="everyone"?"pub":"pri"}">${n.perm==="everyone"?t("every"):t("memb")}</span>
        ${n.author?`<span>— ${esc(n.author)}</span>`:""}
        <span>${t("created")} ${fmt(n.ts)}</span>
        ${n.upd?`<span>${t("editedMark")} ${fmt(n.upd)}</span>`:""}
      </div>
      <div class="ops">
        <button class="btn small ghost" onclick="startEdit('${n.id}')">${t("edit")}</button>
        <button class="btn small ghost" onclick="showHistory('${n.id}')">${t("viewHistory")}</button>
        <button class="btn small danger" onclick="delNote('${n.id}')">${t("del")}</button>
      </div>
    </div>`).join("");
}

window.startEdit = function(id){
  const n = notes.find(x => x.id === id); if(!n) return;
  $("editId").value = id;
  $("noteText").value = n.text; $("noteAuthor").value = n.author || "";
  $("noteVis").value = n.vis; $("notePerm").value = n.perm;
  $("btnCancelEdit").style.display = "inline-block";
  $("p-wall").scrollIntoView({behavior:"smooth"});
};
$("btnCancelEdit").addEventListener("click", () => {
  $("editId").value = ""; $("noteText").value = ""; $("noteAuthor").value = "";
  $("btnCancelEdit").style.display = "none";
});
$("btnSaveNote").addEventListener("click", () => {
  const text = $("noteText").value.trim();
  if(!text){ alert(t("errText")); return; }
  const author = $("noteAuthor").value.trim();
  const vis = $("noteVis").value, perm = $("notePerm").value;
  const editId = $("editId").value;
  if(editId){
    const n = notes.find(x => x.id === editId);
    if(n){
      if(n.text !== text) (n.hist = n.hist || []).push({text: n.text, ts: n.ts});
      n.text = text; n.author = author; n.vis = vis; n.perm = perm; n.upd = Date.now();
    }
  }else{
    notes.unshift({id:"n"+Date.now(), author, text, vis, perm, ts:Date.now(), upd:0, hist:[]});
  }
  store.set("notes", notes);
  $("btnCancelEdit").click();
  renderWall();
});
window.delNote = function(id){
  if(!confirm(t("confirmDel"))) return;
  notes = notes.filter(n => n.id !== id);
  store.set("notes", notes); renderWall();
};
window.showHistory = function(id){
  const n = notes.find(x => x.id === id); if(!n) return;
  const h = n.hist || [];
  $("modalBody").innerHTML = h.length
    ? h.map(x => `<div class="hist-item">${esc(x.text)}<time>${fmt(x.ts)}</time></div>`).join("")
    : `<div class="empty">—</div>`;
  $("mask").classList.add("on");
};
$("modalClose").addEventListener("click", () => $("mask").classList.remove("on"));
$("mask").addEventListener("click", e => { if(e.target === $("mask")) $("mask").classList.remove("on"); });

/* ============ 紀念成員 ============ */
function renderMembers(){
  $("memberCount").textContent = `${members.length} / 1000 ${t("memberUnit")}`;
  $("memberList").innerHTML = members.length ? members.map(m => `
    <div class="member">
      <div class="avatar">${esc(m.ava || "🕯️")}</div>
      <div style="flex:1">
        <div class="who"><b>${esc(m.name)}</b>${m.nick?`<span class="rel">${esc(m.nick)}</span>`:""}${m.rel?`<span class="rel">· ${esc(m.rel)}</span>`:""}</div>
        ${m.msg?`<div class="msg">${esc(m.msg)}</div>`:""}
        <div class="msg">${fmt(m.ts)}</div>
      </div>
    </div>`).join("") : `<div class="empty">${t("join")}</div>`;
}
$("btnJoin").addEventListener("click", () => {
  const name = $("mName").value.trim();
  if(!name){ alert(t("errName")); return; }
  if(members.length >= 1000){ alert(t("memberFull")); return; }
  members.unshift({id:"m"+Date.now(), name, nick:$("mNick").value.trim(), rel:$("mRel").value.trim(),
    ava:$("mAva").value.trim(), msg:$("mMsg").value.trim(), ts:Date.now()});
  store.set("members", members);
  ["mName","mNick","mRel","mAva","mMsg"].forEach(i => $(i).value = "");
  renderMembers();
});

/* ============ 功能反饋（離綫佇列，聯網自動送出） ============ */
function renderFbQueue(){
  const q = fbList.filter(x => x.status === "queued").length;
  const s = fbList.filter(x => x.status === "sent").length;
  $("fbQueueInfo").textContent = tFill("fbQueue", {n:q, m:s});
}
$("btnFb").addEventListener("click", () => {
  const text = $("fbText").value.trim();
  if(!text){ alert(t("errText")); return; }
  fbList.unshift({id:"f"+Date.now(), text, ts:Date.now(), status:"queued"});
  store.set("fb", fbList);
  $("fbText").value = "";
  $("fbStatus").textContent = "· " + t("fbThanks") + " " + t("fbQueued");
  renderFbQueue(); trySendFb();
});
$("btnEndpoint").addEventListener("click", () => {
  endpoint = $("endpoint").value.trim(); store.set("endpoint", endpoint);
  $("fbStatus").textContent = "· OK"; trySendFb();
});
async function trySendFb(){
  if(!endpoint) return;
  const pend = fbList.filter(x => x.status === "queued");
  for(const f of pend){
    try{
      await fetch(endpoint, {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({text:f.text, ts:f.ts, lang})});
      f.status = "sent";
    }catch(e){ /* 保持 queued，下次再試 */ }
  }
  store.set("fb", fbList); renderFbQueue();
  const q = fbList.filter(x => x.status === "queued").length;
  $("fbStatus").textContent = q ? "· " + t("fbQueued") : "· " + t("fbSent");
}
window.addEventListener("online", trySendFb);

/* ============ 肖像 & 啟動 ============ */
$("hdrPortrait").src = PORTRAIT;
$("aboutPortrait").src = PORTRAIT;
$("endpoint").value = endpoint;
buildLangSel();
applyLang();
trySendFb();
</script>
